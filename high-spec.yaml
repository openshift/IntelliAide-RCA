# Example MachineSet for provisioning high-memory worker nodes to run
# IntelliAide analysis workloads on a GCP-backed OpenShift cluster.
#
# This is a TEMPLATE. Replace <infrastructure-id> with your cluster's
# infrastructure ID and <project-id> with your GCP project before applying:
#
#   oc get infrastructure cluster -o jsonpath='{.status.infrastructureName}'
#
# Verify the boot image, region, and zone match your cluster.
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: <infrastructure-id>-high-spec
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: <infrastructure-id>
spec:
  replicas: 2
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: <infrastructure-id>
      machine.openshift.io/cluster-api-machineset: <infrastructure-id>-high-spec
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: <infrastructure-id>
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: <infrastructure-id>-high-spec
    spec:
      providerSpec:
        value:
          machineType: n2-highmem-16
          zone: us-central1-c
          projectID: <project-id>
          region: us-central1
          kind: GCPMachineProviderSpec
          apiVersion: machine.openshift.io/v1beta1
          userDataSecret:
            name: worker-user-data
          credentialsSecret:
            name: gcp-cloud-credentials
          networkInterfaces:
            - network: <infrastructure-id>-network
              subnetwork: <infrastructure-id>-worker-subnet
          disks:
            - autoDelete: true
              boot: true
              image: projects/rhcos-cloud/global/images/rhcos-9-6-20251212-1-gcp-x86-64
              sizeGb: 128
              type: pd-ssd
          tags:
            - <infrastructure-id>-worker
          serviceAccounts:
            - email: <infrastructure-id>-w@<project-id>.iam.gserviceaccount.com
              scopes:
                - 'https://www.googleapis.com/auth/cloud-platform'
          canIPForward: false
          deletionProtection: false
          shieldedInstanceConfig: {}
